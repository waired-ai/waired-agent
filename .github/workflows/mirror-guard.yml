# Fails a PR that changes one half of an installer pair (install.sh /
# install.ps1, uninstall.sh / uninstall.ps1) without the other.
# Rationale and the one-line opt-out: scripts/ci/installer-mirror-guard.sh.
#
# No `paths:` filter on purpose — a paths-gated job produces no check run
# when the filter misses, so it could never be a required check. The
# script exits 0 in a second when no installer is touched. Same reasoning
# as docs-guard.yml and installtest.yml.
#
# GitHub-hosted runner, like dco/gitleaks/docs-guard: a read-only static
# check with no secrets, safe to run on fork PRs ahead of maintainer
# approval of the heavier CI.
name: mirror-guard

on:
  pull_request:
    # `edited` matters: the opt-out lives in the PR body, so editing the
    # body has to re-run this check without needing a push.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: mirror-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  installer-pairs:
    name: installer pairs mirrored
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: install.sh / install.ps1 changed together
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/ci/installer-mirror-guard.sh
