# installtest — the working-tree installer run end-to-end on a real OS,
# on EVERY PR (waired#760; re-homed from the pre-split monorepo per #1).
#
# install.sh / install.ps1 ship to users via `curl | sh` / `iwr | iex`, and
# package postinst / systemd / SCM / LaunchDaemon behavior only fails on a
# real `install → service-manager` machine — which the hermetic dash matrix
# (ci.yml `install-scripts`) and Go unit tests can't exercise. Each leg runs
# the installer in place on a disposable GitHub-hosted VM, so the
# destructive steps are contained by the VM boundary.
#
# 3-OS matrix: Linux (deb → systemd), Windows (install.ps1 → SCM, plus the
# waired#760 additions: behavioral-contract asserts, non-elevated contexts,
# uninstall -Clean teardown asserts, and the Inno .exe-install variant),
# macOS (install.sh darwin → system LaunchDaemon). Tier 2 enrolls hands-free
# against the real dev control plane via the SA-OIDC grant (WIF mints the SA
# id_token; #339).
#
# Always-on (no paths filter, waired#760): the previous paths-gated shape
# could never be a required status check; this one can — flip branch
# protection once the signal is proven stable. The Windows contract asserts
# tied to open issues (#749/#751/#754/#755) SOFT-fail (WARN) until each fix
# merges, so a green run means "no regression against the current contract".
# The cp932 banner render check moved to the nightly workflow
# (installtest-inference.yml) — it only breaks on installer-surface changes
# and cost ~2 min of the per-PR critical path.
#
# Fork PRs: the legs are skipped (not failed) — the job condition requires a
# same-repo head. Fork code must not reach the WIF identity; GitHub also
# withholds the id-token from fork PRs. A maintainer arms a reviewed fork PR
# by pushing its branch to this repo.
name: installtest

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: installtest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write       # Workload Identity Federation (mint the enroll token)

defaults:
  run:
    shell: bash

jobs:
  installtest:
    name: install test (${{ matrix.os }})
    # Same-repo only: fork PRs get a skipped check (see header).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false        # a red Windows leg must not hide a green Linux leg
      matrix:
        include:
          - os: linux
            runs-on: ubuntu-24.04
            timeout: 20
          - os: windows
            # GH-hosted disposable VM — the job runs ELEVATED, so
            # install.ps1's real SCM service install works and the
            # destructive steps stay contained by the VM boundary.
            runs-on: windows-latest
            timeout: 35
          - os: macos
            # GH-hosted Apple-Silicon disposable VM (pinned like the
            # ubuntu leg); passwordless sudo for the LaunchDaemon install.
            runs-on: macos-14
            timeout: 30
    env:
      # Tier 2: hands-free enroll vs the real dev control plane (#339 grant).
      IT_ENROLL_MODE: authkey
      IT_IMPERSONATE_SA: waired-devtest-login@dev-waired.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      # gcloud uses the WIF credential to mint the SA id_token in the harness.
      - uses: google-github-actions/setup-gcloud@v3

      # Linux: build the worktree deb + serve it from a signed local apt repo
      # on loopback, then run install.sh in place (systemd is PID 1 on the
      # disposable runner) and assert Tier 1 (package/user/state-dir/unit
      # enabled+active/idempotency/self-heal) + Tier 2 (hands-free enroll →
      # enrolled daemon). IT_LOCAL=1 is the run-in-place mode; the destructive
      # opt-in guards a dev from running it on a workstation.
      - name: install test (linux, tier 1+2)
        if: matrix.os == 'linux'
        env:
          IT_LOCAL: "1"
          IT_ALLOW_LOCAL_DESTRUCTIVE: "1"
        run: |
          set -euo pipefail
          export PATH="$HOME/go/bin:$PATH"
          # --with-tray builds and serves the waired-tray .deb as well as
          # waired's. The leg still INSTALLS without it (run_install passes
          # WAIRED_NO_TRAY=1, and the 47 other asserts are written against
          # that shape); what this buys is that the #1031 tray-stop asserts
          # can pull the package when they need it, instead of standing down
          # with a skip that reads as a pass. On Linux the tray is pure Go,
          # so the extra build is a `go build` and an `nfpm pkg`.
          bash scripts/dev/installtest-host-up.sh --with-tray
          # tee so the transcript exists as a FILE for the collector below.
          # Without it this leg's only record was the job log, which cannot be
          # downloaded, diffed or kept (waired-agent#1158). pipefail is on, so
          # the harness's exit status still decides the step.
          bash scripts/dev/installtest-run.sh --tier 2 2>&1 | tee it.log

      # Windows: build the exes, pack the release zip, serve it from a
      # loopback mirror, run install.ps1 in place (the job is elevated, so
      # the inline SCM path runs — no UAC), Tier-1 asserts, hands-free OIDC
      # enroll (Tier 2), then the waired#760 additions: contract asserts
      # (#749/#751/#755 — soft while open), non-elevated `waired status`
      # contexts, teardown via uninstall.ps1 -Clean with leftover asserts
      # (#754 — soft), and the Inno .exe-install variant (ISCC is baked into
      # the runner image).
      - name: install test (windows, tier 1+2 + contract + exe variant)
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/dev/installtest-windows.ps1 -Tier 2 -Contract -ExeVariant

      # The hosted windows-latest image ships with Defender real-time
      # protection (and with it the AMSI provider) turned off, which made the
      # canary below degrade to a meaningless no-provider soft-fail after the
      # GH-hosted migration (waired#848). Tamper Protection is off on the
      # runner image, so re-enabling via Set-MpPreference is possible; done
      # right before the canary (not before the install test) so Defender
      # doesn't slow or perturb the install run itself. Best-effort: if the
      # provider still doesn't come alive, the canary keeps soft-failing and
      # the fallback is moving it to the Defender-live nightly leg.
      - name: enable Defender real-time protection (AMSI provider)
        if: matrix.os == 'windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Start-Service WinDefend
          Set-MpPreference -DisableRealtimeMonitoring $false `
            -DisableScriptScanning $false -DisableIOAVProtection $false
          # The image bakes definitions at image-build time (days stale;
          # 1.455.137 vs same-day 1.455.219 when this landed). #552's lesson
          # is that a defs update alone can flip a verdict, and the canary
          # models a user's up-to-date stock Windows — so pull the latest
          # security intelligence. Best-effort: on failure the scan still
          # runs against the baked defs under a live provider.
          try { Update-MpSignature -ErrorAction Stop }
          catch { Write-Warning "Update-MpSignature failed: $_ (scanning with image-baked definitions)" }
          Get-MpComputerStatus |
            Select-Object AMRunningMode, RealTimeProtectionEnabled,
              AntivirusEnabled, AntivirusSignatureVersion,
              AntivirusSignatureLastUpdated | Format-List

      # High-fidelity AMSI canary (#553 Gate B). The install test above runs
      # a call-operator on the on-disk file, so the AMSI-of-body path that
      # `iwr | iex` users hit stays untested even here; this scans the
      # installer scripts through the live Defender engine. SOFT-FAIL: a
      # non-deterministic Defender verdict (engine/defs/cloud drift) must not
      # red an always-on check.
      - name: AMSI canary (windows, Defender-live) — soft-fail
        if: matrix.os == 'windows'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/dev/amsi-scan.ps1 -Strict -OnNoProvider fail -ClearExclusionsForScan

      # macOS, the launchd manager against REAL launchctl (#195/#176).
      # TestRealLaunchdRoundTrip has existed since #218 and covers the whole
      # install -> stop -> start -> uninstall -> print-disabled -> reinstall
      # cycle, but it is gated on WAIRED_LAUNCHD_REALHOST + euid 0 (it mutates
      # /Library/LaunchDaemons and the system launchd domain), and nothing set
      # either — so the one test written specifically for #176 had never
      # executed anywhere. It does here: the runner is disposable.
      #
      # BEFORE the harness, not after: this test registers the SAME label
      # (com.waired.agent) as the product, so running it against an installed
      # host would bootout the harness's real daemon. Its own t.Cleanup
      # uninstalls, leaving a clean host for the install test below.
      #
      # COMPILE as the runner user, RUN as root. `sudo go test` would invoke
      # the toolchain as root, which writes root-owned entries into the shared
      # GOCACHE / GOMODCACHE under ~/go — and every later unprivileged build in
      # this job then dies with "mkdir ...: permission denied" (observed on the
      # first run of this step). Only the compiled binary needs the privilege.
      #
      # `sudo env` because sudo strips the environment, so the gate variable
      # has to be re-applied inside it.
      - name: real launchd round trip (macos, #176)
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/service.test" ./internal/platform/service/
          sudo env WAIRED_LAUNCHD_REALHOST=1 "$RUNNER_TEMP/service.test" \
            -test.run TestRealLaunchdRoundTrip -test.v 2>&1 | tee "$RUNNER_TEMP/launchd.log"
          # A compiled test binary reports "no tests to run" -> PASS when the
          # -test.run pattern matches nothing, and the test SKIPs when its two
          # gates are not both set. Either would make this step vacuously
          # green, which is the failure mode #215 is about — so require the
          # test to have actually passed.
          grep -q '^--- PASS: TestRealLaunchdRoundTrip' "$RUNNER_TEMP/launchd.log"

      # macOS: build the darwin tarball, point install.sh's darwin path at it
      # (file://), run it, assert binaries + the system LaunchDaemon plist +
      # root-owned state dir, the uninstall -> reinstall round trip (#195),
      # then a hands-free OIDC enroll (Tier 2). The agent is a system
      # LaunchDaemon — it bootstraps + enrolls headless. Needs passwordless
      # sudo (the hosted runner user has it).
      - name: install test (macos, tier 1+2)
        if: matrix.os == 'macos'
        run: bash scripts/dev/installtest-macos.sh --tier 2

      # This workflow kept NOTHING on a red leg: no failure step, no artifact,
      # so the only evidence was whatever the harness had already printed into
      # a job log — which ages out, cannot be diffed, and is not the file
      # (waired-agent#1158). Two of these legs own coverage nothing else has:
      # the Windows -Contract leg is the only place uninstall.ps1 -Clean is a
      # test subject, and since waired-agent#1156 the macOS leg is the only
      # place uninstall.sh --clean and the root-shell install still run.
      #
      # EXPECT_ENGINE=0: none of these three legs installs an engine
      # (install.sh has not since #138), so the collector's missing-engine-log
      # warning would fire on every failure here and mean nothing. What is
      # worth having is the install/uninstall transcripts and the agent's own
      # log. `cancelled()` too, for the reason installtest-inference.yml
      # gives: a job killed by timeout-minutes is when evidence matters most.
      - name: collect install diagnostics
        if: failure() || cancelled()
        shell: bash
        env:
          EXPECT_ENGINE: "0"
        run: |
          set +e
          case "${{ matrix.os }}" in
            linux)
              dir=/var/lib/waired
              bash scripts/ci/collect-engine-diag.sh "$dir" it.log
              # The harness keeps its per-assert CLI transcripts here, outside
              # the repo on purpose (lib/installtest-common.sh).
              cp -r "${IT_WORKDIR:-$HOME/.cache/waired-installtest}/logs" diag/harness-logs 2>/dev/null
              sudo chown -R "$(id -un)" diag 2>/dev/null
              ;;
            macos)
              dir="/Library/Application Support/waired"
              # Staged out of the harness's mktemp dir by its cleanup(),
              # which deletes $WORK on every exit path (waired-agent#1158).
              bash scripts/ci/collect-engine-diag.sh "$dir" \
                "${RUNNER_TEMP}"/installtest-macos/*.log \
                "${RUNNER_TEMP}"/installtest-macos/*.flag \
                "${RUNNER_TEMP}/launchd.log"
              ;;
            windows)
              dir=/c/ProgramData/waired
              # $TEMP is a backslash path on the Windows runner; cygpath is
              # how Git Bash turns it into something joinable. Globs rather
              # than a file list, because this is the -Contract / -ExeVariant
              # leg and its evidence is spread over names added at different
              # times: init.log, innosetup.log, uninstall-after-granted.log,
              # status-elevated.log, and phase2.out — hence *.out as well as
              # *.log. An unmatched glob stays literal and is skipped by the
              # collector's own [ -f ] guard, so listing both is free.
              tmp="${TEMP:-/tmp}"
              if command -v cygpath >/dev/null 2>&1; then tmp="$(cygpath -u "$tmp")"; fi
              bash scripts/ci/collect-engine-diag.sh "$dir" \
                "${tmp}"/waired-installtest-win/*.log \
                "${tmp}"/waired-installtest-win/*.out
              ;;
          esac
          ls -la diag || true

      - name: upload install diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          # run_attempt, not run_id: it is what makes "Re-run failed jobs"
          # produce a second artifact instead of colliding with the first.
          name: installtest-diag-${{ matrix.os }}-${{ github.run_attempt }}
          path: diag/
          if-no-files-found: ignore
          retention-days: 14
