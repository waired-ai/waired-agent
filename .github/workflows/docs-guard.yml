# Two guards on the same question — does this PR leave the documentation
# describing something that is no longer true?
#
#   * a PR that changes a user-visible surface (the Waired app, the CLI,
#     the install scripts) must touch docs-site/;
#   * a PR that changes an English docs page must change its Japanese one.
#
# Rationale and the one-line opt-out for each: scripts/ci/docs-surface-guard.sh
# and scripts/ci/i18n-pair-guard.sh.
#
# One job each, so each rule reports under its own name. They shared a job
# for one commit (waired-agent#1215) because the surface name was already a
# required status check and a second job could not be required until the
# repository ruleset named it; a check whose name says one rule and whose
# red says another is not a check anybody reads twice.
#
# No `paths:` filter on purpose — a paths-gated job produces no check
# run when the filter misses, so it could never be a required check.
# Both scripts exit 0 in a second when they have nothing to check, which
# is why running them as two jobs costs nothing worth saving.
#
# GitHub-hosted runner, like dco/gitleaks/proto-guard: a read-only
# static check with no secrets, safe to run on fork PRs ahead of
# maintainer approval of the heavier self-hosted CI.
name: docs-guard

on:
  pull_request:
    # `edited` matters: the opt-out for each guard lives in the PR body, so
    # editing the body has to re-run these checks without needing a push.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: docs-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  surface:
    name: user-visible surface documented
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: docs-site covers the changed surface
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/ci/docs-surface-guard.sh

  # Deliberately not `needs: surface` — a PR that trips both is told both
  # at once rather than one per push, and neither answer depends on the
  # other.
  mirror:
    name: japanese mirror updated with the english page
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: the japanese page changes with the english one
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/ci/i18n-pair-guard.sh
