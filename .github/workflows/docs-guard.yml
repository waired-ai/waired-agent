# Two guards on the same question — does this PR leave the documentation
# describing something that is no longer true?
#
#   * a PR that changes a user-visible surface (the Waired app, the CLI,
#     the install scripts) must touch docs-site/;
#   * a PR that changes an English docs page must change its Japanese one.
#
# Rationale and the one-line opt-out for each: scripts/ci/docs-surface-guard.sh
# and scripts/ci/i18n-pair-guard.sh.
#
# They share one job, and therefore one check run, whose name says only the
# first of the two. That is deliberate for now: the name is a required
# status check in the repository ruleset, so a second job would not be
# required until an owner edits the ruleset, and the ja rule replaces one
# that already blocked landing in practice (waired-agent#1215). Splitting
# them into two named contexts is the tidier end state.
#
# No `paths:` filter on purpose — a paths-gated job produces no check
# run when the filter misses, so it could never be a required check.
# Both scripts exit 0 in a second when they have nothing to check.
#
# GitHub-hosted runner, like dco/gitleaks/proto-guard: a read-only
# static check with no secrets, safe to run on fork PRs ahead of
# maintainer approval of the heavier self-hosted CI.
name: docs-guard

on:
  pull_request:
    # `edited` matters: the opt-out lives in the PR body, so editing the
    # body has to re-run this check without needing a push.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: docs-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  surface:
    name: user-visible surface documented
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: docs-site covers the changed surface
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/ci/docs-surface-guard.sh

      # Runs even when the step above failed, so a PR that trips both is
      # told both at once rather than one per push.
      - name: the japanese mirror keeps up with the english page
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/ci/i18n-pair-guard.sh
