# installtest-inference — the nightly installtest umbrella (#514, waired#760;
# re-homed from the pre-split monorepo per #1): the install→inference tail of
# the first-run journey, the 3-OS daemon-path setup-executor engine install
# (waired#835 §9/§11), the 3-OS coding-agent routing sentinel, and the
# Windows installer banner render check.
#
# installtest.yml (the per-PR gate) runs the real `install → service-manager
# → hands-free enroll` journey but STOPS before inference: every leg passes
# --skip-ollama / --inference-enabled=false. This workflow runs the SAME
# harness with inference ON — `waired init --inference-enabled=true` installs
# the bundled engine, pulls the bundled model in its deploy phase and runs the
# end-of-init benchmark. That covers the class where the post-install
# benchmark / auto model-fallback never ran on a fresh bundled install, which
# an install/enroll-only gate cannot see. (Since #138 no installer puts an
# engine on the host on any OS; init owns that decision. --skip-ollama /
# -SkipOllama survive as the way to tell init not to.)
#
# Why scheduled, not per-PR: an engine install + a bundled-model pull (~5 GB) +
# a benchmark is minutes-scale and depends on EXTERNAL state (the pinned Ollama
# release assets + the model registry), so it suits a nightly canary. Being
# schedule/dispatch-only it carries no paths filter and is never a required
# check.
#
# The banner job is per waired#760: the cp932 render check only breaks on
# installer-surface changes, so it left the per-PR critical path (~2 min)
# and runs here nightly instead.
#
# Runners: the three install/inference legs run on GH-hosted disposable VMs,
# the same images the per-PR installtest.yml already uses for all three OSes.
# On a PUBLIC repository the standard runners are free and unlimited, and
# carry ubuntu-24.04 4 vCPU / 16 GB, windows-latest 4 vCPU / 16 GB, macos-14
# 3 vCPU (M1) / 7 GB —
# https://docs.github.com/en/actions/reference/runners/github-hosted-runners
#
# Windows and macOS used to sit on the self-hosted ephemeral-VM pools. That
# started as an Actions-cost measure while the client lived in the private
# monorepo (see waired#516 for the analysis), and was then justified as
# needing hardware representative of real user machines. Neither holds now:
# this repo is public, and both pools reported 4 GB RAM to hostfit
# — LESS memory than the hosted runners — which is why the macOS bundled
# Ollama could not boot its Metal engine there at all (waired#573). Being
# reused slots they also could not take the egress blackhole guard below, and
# an engine a previous leg installed could stand in for the one the
# daemon-engine leg exists to prove (#139).
#
# Still self-hosted, for reasons that do hold: the banner render check needs
# a real interactive console (hosted runners get a service session), and the
# vLLM / agent-harness lanes need a real GPU.
name: installtest-inference

on:
  schedule:
    # 08:00 UTC weekdays (17:00 JST). Offset from catalog-radar (Wed 00:00)
    # and renovate (Mon 00:00) so the heavy jobs never contend for runners.
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      os:
        description: Which OS leg(s) to run (cheap single-OS dry-runs; none = only the jobs picked below)
        default: all
        type: choice
        options: [all, linux, windows, macos, none]
      sac_audit:
        description: Smart App Control signing audit (windows). Runs nightly anyway; pair with os=none to run it alone.
        default: 'off'
        type: choice
        options: ['off', 'on']
      gpu:
        description: GPU vLLM install+serve lane (needs a self-hosted L4 runner)
        default: 'off'
        type: choice
        options: ['off', quick, full]
      agentgrade_model:
        description: >-
          Agent-harness grade: ollama tag to measure (e.g.
          qwen2.5-coder:7b-instruct-q4_K_M). Empty = skip. Needs the L4 runner.
        default: ''
        type: string

concurrency:
  group: installtest-inference
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write       # Workload Identity Federation (mint the enroll token)

defaults:
  run:
    shell: bash

jobs:
  # Resolve which OS legs to run from the dispatch input (default = all three;
  # a schedule has no input → all three). A dynamic matrix keeps a single-OS
  # dry-run from claiming Windows / macOS runners it will not use.
  legs:
    name: select legs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          SEL: ${{ github.event.inputs.os || 'all' }}
        run: |
          set -euo pipefail
          # Same images as installtest.yml's three legs, deliberately: these
          # are the SAME harness scripts, so a per-PR green there is only
          # evidence for here if the image matches. windows-latest runs the
          # job elevated (install.ps1's real SCM path); macos-14 is the
          # pinned Apple-Silicon image with passwordless sudo for the
          # LaunchDaemon install.
          linux='{"os":"linux","runs-on":"ubuntu-24.04","timeout":35}'
          windows='{"os":"windows","runs-on":"windows-latest","timeout":45}'
          macos='{"os":"macos","runs-on":"macos-14","timeout":45}'
          case "$SEL" in
            linux)   legs="[$linux]" ;;
            windows) legs="[$windows]" ;;
            macos)   legs="[$macos]" ;;
            # An empty include produces zero matrix entries, so every job that
            # reads this matrix is skipped. That is how a dispatch runs ONLY a
            # non-matrix job (the banner render check, the SAC signing audit)
            # without claiming three runners for legs it does not want.
            none)    legs="[]" ;;
            *)       legs="[$linux,$windows,$macos]" ;;
          esac
          echo "matrix={\"include\":$legs}" >> "$GITHUB_OUTPUT"

  installtest-inference:
    needs: legs
    name: install+inference (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false      # a red Windows/macOS leg must not hide a green Linux
      matrix: ${{ fromJSON(needs.legs.outputs.matrix) }}
    env:
      # Tier 2: hands-free enroll vs the real dev control plane (#339 grant).
      IT_ENROLL_MODE: authkey
      IT_IMPERSONATE_SA: waired-devtest-login@dev-waired.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      # gcloud uses the WIF credential to mint the SA id_token in the harness.
      - uses: google-github-actions/setup-gcloud@v3

      # Linux: in-place install (systemd is PID 1 on the disposable runner) +
      # --inference → `waired init --inference-enabled=true` installs the
      # bundled engine, pulls the bundled model + benchmarks on CPU.
      - name: install+inference (linux, tier 2)
        if: matrix.os == 'linux'
        env:
          IT_LOCAL: "1"
          IT_ALLOW_LOCAL_DESTRUCTIVE: "1"
          # Keep q8_0 + flash attention exercised against a REAL engine.
          # Since waired-agent#29 the serve tuning requests that pair only
          # where it buys context, so a CPU-only host would otherwise never
          # run it — and the GPU runner below is vLLM-only, so this is the
          # last real-engine coverage that combination has. Deliberately NOT
          # on the routing-sentinel leg: that one must exercise the
          # configuration real users get.
          IT_AGENT_ENV_EXTRA: WAIRED_OLLAMA_KV_CACHE_TYPE=q8_0
        run: |
          set -euo pipefail
          export PATH="$HOME/go/bin:$PATH"
          bash scripts/dev/installtest-host-up.sh
          bash scripts/dev/installtest-run.sh --tier 2 --inference 2>&1 | tee it-inf.log

      # Windows: install.ps1 (the runner is already elevated) + -WithInference.
      # No tee here — the exit code must propagate directly; the full
      # transcript is in this step's log.
      - name: install+inference (windows, tier 2)
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/dev/installtest-windows.ps1 -Tier 2 -WithInference

      # macOS: install.sh darwin + --inference (system LaunchDaemon, so it
      # serves headless). Needs passwordless sudo (the ephemeral VM admin
      # has it).
      - name: install+inference (macos, tier 2)
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          bash scripts/dev/installtest-macos.sh --tier 2 --inference 2>&1 | tee it-inf.log

      # #22: on a macOS failure the ollama engine's own stdout+stderr — the
      # real "exit status 1" reason — lives in a root-owned engine.log the
      # transcript never shows. Stage it (+ the tee'd it-inf.log) so a
      # nightly failure is diagnosable after the runner is gone.
      - name: collect ollama diagnostics (macos)
        if: failure() && matrix.os == 'macos'
        run: |
          mkdir -p diag
          [ -f it-inf.log ] && cp it-inf.log diag/ || true
          englog="/Library/Application Support/waired/runtimes/ollama/logs/engine.log"
          if sudo test -f "$englog"; then
            sudo cp "$englog" diag/engine.log && sudo chown "$(id -un)" diag/engine.log || true
          fi
          ls -la diag || true
      - name: upload ollama diagnostics (macos)
        if: failure() && matrix.os == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: ollama-diag-install-inference-macos-${{ github.run_attempt }}
          path: diag/
          if-no-files-found: ignore
          retention-days: 14

      # Surface a one-line result + any captured throughput in the run summary
      # (Actions-native, no auto-issue). bash exists on all three runners.
      # The Windows leg has no it-inf.log, so it just records the job status.
      - name: job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## install+inference (${{ matrix.os }})"
            echo "- result: **${{ job.status }}**"
            if [ -f it-inf.log ]; then
              grep -iE 'summary:|[0-9.]+ *(tok|tokens)/s' it-inf.log \
                | sed -E 's/\x1b\[[0-9;]*m//g; s/^/- /' | tail -6 || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 3-OS daemon-path setup-executor engine install (waired#835 §9/§11). Unlike
  # install+inference above, the engine is DELIBERATELY absent after install
  # (install.sh/.ps1 run --skip-ollama) and the enrol is driven through the
  # DAEMON path — the real post-#119 first-run — by completing the daemon's
  # login session out-of-band via the OIDC grant, so the resident `waired init`
  # executor installs the engine. The auth-key enrol the
  # other legs use never reaches that path. Nightly (a real engine install +
  # tiny model pull is minutes-scale + external-state, like install+inference).
  # See scripts/dev/lib/installtest-daemon-engine.sh for the WHY.
  daemon-engine:
    needs: legs
    name: daemon-path engine install (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false      # a red Windows/macOS leg must not hide a green Linux
      matrix: ${{ fromJSON(needs.legs.outputs.matrix) }}
    env:
      # Tier 2: hands-free enroll vs the real dev control plane (#339 grant).
      IT_ENROLL_MODE: authkey
      IT_IMPERSONATE_SA: waired-devtest-login@dev-waired.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      # gcloud uses the WIF credential to mint the SA id_token in the harness.
      - uses: google-github-actions/setup-gcloud@v3

      # Linux: in-place install (systemd is PID 1 on the disposable runner),
      # engine ABSENT (--skip-ollama), then daemon-path init → executor install.
      - name: daemon-path engine install (linux, tier 2)
        if: matrix.os == 'linux'
        env:
          IT_LOCAL: "1"
          IT_ALLOW_LOCAL_DESTRUCTIVE: "1"
        run: |
          set -euo pipefail
          export PATH="$HOME/go/bin:$PATH"
          bash scripts/dev/installtest-host-up.sh
          bash scripts/dev/installtest-run.sh --tier 2 --daemon-engine

      - name: daemon-path engine install (windows, tier 2)
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/dev/installtest-windows.ps1 -Tier 2 -DaemonEngine

      - name: daemon-path engine install (macos, tier 2)
        if: matrix.os == 'macos'
        run: bash scripts/dev/installtest-macos.sh --tier 2 --daemon-engine

      # The Windows leg had no diagnostics at all: on a red nightly the only
      # evidence was whatever the harness had already chosen to print, and the
      # daemon's own account of why the executor did not install was on a
      # runner that no longer exists. The two init transcripts, the watcher's
      # flag file and the agent log are what a diagnosis actually needs
      # (waired-agent#527).
      - name: collect daemon-path diagnostics (windows)
        if: failure() && matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          $work = Join-Path $env:TEMP 'waired-installtest-win'
          foreach ($n in 'init.log', 'reinit.log', 'daemon-engine.flag') {
            $p = Join-Path $work $n
            if (Test-Path -LiteralPath $p) { Copy-Item -LiteralPath $p -Destination diag -Force }
          }
          $agentLog = 'C:\ProgramData\waired\logs\waired-agent.log'
          if (Test-Path -LiteralPath $agentLog) { Copy-Item -LiteralPath $agentLog -Destination diag -Force }
          # The daemon's view at teardown. Both are reads, so the #838 write
          # guard leaves them on TCP.
          foreach ($r in @{n = 'setup-state.json'; u = 'http://127.0.0.1:9476/waired/v1/setup/state' },
                          @{n = 'inference-status.json'; u = 'http://127.0.0.1:9476/waired/v1/inference/status' }) {
            try {
              Invoke-RestMethod -Uri $r.u -TimeoutSec 5 | ConvertTo-Json -Depth 8 |
                Set-Content -LiteralPath (Join-Path diag $r.n)
            } catch { "unreachable: $($_.Exception.Message)" | Set-Content -LiteralPath (Join-Path diag $r.n) }
          }
          Get-ChildItem diag | Format-Table Name, Length | Out-String | Write-Host
      - name: upload daemon-path diagnostics (windows)
        if: failure() && matrix.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: daemon-engine-diag-windows-${{ github.run_attempt }}
          path: diag/
          if-no-files-found: ignore
          retention-days: 14

      - name: job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## daemon-path engine install (${{ matrix.os }})"
            echo "- result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  # The AI software installed, and no model chosen (waired-agent#590; owner
  # decision 2026-08-08, waired-ai/waired#1067). The #586 picker offers
  # "0) Don't download a model now", and that answer is a FINISHED install —
  # exit 0, an engine on disk, and a standing choice the daemon keeps across a
  # restart instead of the #379 boot pre-pull fetching something anyway.
  #
  # Here rather than on the per-PR gate for the same reason install+inference
  # is: it installs a real engine from a release asset. Cheaper than its
  # neighbours, though — the whole point of the state under test is that no
  # weights are downloaded.
  #
  # All three OSes since waired-agent#590's twins landed. It is the suite's one
  # INTERACTIVE init — one line of stdin into the model picker — and each
  # harness delivers that line the way its shell can: `printf '0\n' |` on the
  # two Unixes, a string piped into the native command on Windows (PowerShell
  # has no `<` redirect). Every leg's anti-vacuity assert is the picker's own
  # acknowledgement line, so a leg that silently answered nothing goes red
  # rather than quietly passing.
  engine-only:
    needs: legs
    name: engine installed, no model chosen (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false      # a red Windows/macOS leg must not hide a green Linux
      matrix: ${{ fromJSON(needs.legs.outputs.matrix) }}
    env:
      # Tier 2: hands-free enroll vs the real dev control plane (#339 grant).
      IT_ENROLL_MODE: authkey
      IT_IMPERSONATE_SA: waired-devtest-login@dev-waired.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      # gcloud uses the WIF credential to mint the SA id_token in the harness.
      - uses: google-github-actions/setup-gcloud@v3

      - name: engine installed, no model chosen (linux, tier 2)
        if: matrix.os == 'linux'
        env:
          IT_LOCAL: "1"
          IT_ALLOW_LOCAL_DESTRUCTIVE: "1"
        run: |
          set -euo pipefail
          export PATH="$HOME/go/bin:$PATH"
          bash scripts/dev/installtest-host-up.sh
          bash scripts/dev/installtest-run.sh --tier 2 --engine-only 2>&1 | tee it-engine-only.log

      - name: engine installed, no model chosen (windows, tier 2)
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/dev/installtest-windows.ps1 -Tier 2 -EngineOnly

      - name: engine installed, no model chosen (macos, tier 2)
        if: matrix.os == 'macos'
        run: bash scripts/dev/installtest-macos.sh --tier 2 --engine-only

      # The interesting failure here is "the picker never ran", and the
      # evidence for it is the init transcript plus what the daemon thinks it
      # was told. Stage both while the runner still exists. Linux only: the
      # other two harnesses keep their transcripts in a mktemp dir that is
      # theirs to name, and their own failure paths already tail the relevant
      # log into the job output.
      - name: collect engine-only diagnostics
        if: failure() && matrix.os == 'linux'
        run: |
          mkdir -p diag
          cp it-engine-only.log diag/ 2>/dev/null || true
          cp -r "${IT_WORKDIR:-$HOME/.cache/waired-installtest}/logs" diag/harness-logs 2>/dev/null || true
          curl -fsS --max-time 10 http://127.0.0.1:9476/waired/v1/inference/status > diag/inference-status.json 2>/dev/null || true
          sudo chown -R "$(id -un)" diag || true
          ls -la diag || true
      - name: upload engine-only diagnostics
        if: failure() && matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: engine-only-diag-linux-${{ github.run_attempt }}
          path: diag
          if-no-files-found: ignore
          retention-days: 7

      - name: job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## engine installed, no model chosen (${{ matrix.os }})"
            echo "- result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  # 3-OS coding-agent routing sentinel (#496). Rides the SAME enrolled-daemon
  # harness with `--integration`, which pins the withheld 350M as the bundled
  # model (deploy pulls ~0.7 GB), then runs the Go routing harness that
  # drives each leg at the gateway surface and asserts served-locally via the
  # observability event ring. (The old per-PR Linux routing-sentinel workflow
  # is not yet re-homed — #1.)
  routing:
    needs: legs
    name: routing sentinel (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.legs.outputs.matrix) }}
    env:
      IT_ENROLL_MODE: authkey
      IT_IMPERSONATE_SA: waired-devtest-login@dev-waired.iam.gserviceaccount.com
      # Fail-open guard: a regression that reaches real Anthropic gets a 401
      # with this bogus token (the event-ring sentinel is the portable
      # primary).
      ANTHROPIC_AUTH_TOKEN: waired-routing-sentinel-dummy-not-a-real-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      # gcloud uses the WIF credential to mint the SA id_token in the harness.
      - uses: google-github-actions/setup-gcloud@v3

      # Linux-only belt-and-braces egress blackhole. It used to be Linux-only
      # because the Windows/macOS pools were reused slots; now that all three
      # legs are disposable VMs, the remaining blocker is the harness — only
      # scripts/dev/lib/installtest-integration.sh reads IT_ANTHROPIC_BLACKHOLED
      # and passes it through as WAIRED_ANTHROPIC_BLACKHOLED, and the macOS /
      # Windows harnesses have no equivalent. Until they do, those two legs
      # rely on dummy-token + sentinel only.
      - name: blackhole api.anthropic.com (fail-open guard, linux)
        if: matrix.os == 'linux'
        run: echo "0.0.0.0 api.anthropic.com" | sudo tee -a /etc/hosts >/dev/null

      - name: routing sentinel (linux, tier 2 + integration)
        if: matrix.os == 'linux'
        env:
          IT_LOCAL: "1"
          IT_ALLOW_LOCAL_DESTRUCTIVE: "1"
          # Matches the blackhole step above: with the guard armed, "cannot
          # reach the upstream API" proves the request escaped local routing,
          # so the harness fails fast instead of retrying a lost cause.
          IT_ANTHROPIC_BLACKHOLED: "1"
        run: |
          set -euo pipefail
          export PATH="$HOME/go/bin:$PATH"
          bash scripts/dev/installtest-host-up.sh
          bash scripts/dev/installtest-run.sh --tier 2 --integration

      - name: routing sentinel (windows, tier 2 + integration)
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/dev/installtest-windows.ps1 -Tier 2 -WithIntegration

      - name: routing sentinel (macos, tier 2 + integration)
        if: matrix.os == 'macos'
        run: bash scripts/dev/installtest-macos.sh --tier 2 --integration 2>&1 | tee it-inf.log

      # #22: same as the install+inference leg — surface the ollama engine's
      # own engine.log (the real startup-crash reason) on a macOS failure.
      - name: collect ollama diagnostics (macos)
        if: failure() && matrix.os == 'macos'
        run: |
          mkdir -p diag
          [ -f it-inf.log ] && cp it-inf.log diag/ || true
          englog="/Library/Application Support/waired/runtimes/ollama/logs/engine.log"
          if sudo test -f "$englog"; then
            sudo cp "$englog" diag/engine.log && sudo chown "$(id -un)" diag/engine.log || true
          fi
          ls -la diag || true
      - name: upload ollama diagnostics (macos)
        if: failure() && matrix.os == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: ollama-diag-routing-macos-${{ github.run_attempt }}
          path: diag/
          if-no-files-found: ignore
          retention-days: 14

      # waired-agent#29: the Linux leg had no equivalent, so a crashed
      # llama-server left no trace at all. `cancelled()` too — a job killed by
      # timeout-minutes is exactly when the evidence matters most.
      - name: collect ollama diagnostics (linux)
        if: (failure() || cancelled()) && matrix.os == 'linux'
        run: |
          set +e
          mkdir -p diag
          sudo cp /var/lib/waired/runtimes/ollama/logs/engine.log diag/engine.log
          sudo journalctl -u waired-agent --no-pager -n 2000 > diag/waired-agent.journal 2>&1
          curl -fsS --max-time 5 http://127.0.0.1:9476/waired/v1/inference/status > diag/inference-status.json 2>&1
          sudo chown -R "$(id -un)" diag
          ls -la diag
      - name: upload ollama diagnostics (linux)
        if: (failure() || cancelled()) && matrix.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: ollama-diag-routing-linux-${{ github.run_attempt }}
          path: diag/
          if-no-files-found: ignore
          retention-days: 14

      - name: job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## routing sentinel (${{ matrix.os }})"
            echo "- result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  # Windows installer banner render regression guard, moved out of the per-PR
  # path (waired#760). The rich UTF-8 banner is emitted ONLY to a real TTY,
  # so redirected-stdout install steps never render it — visual banner
  # mojibake is invisible to normal CI. This spawns install.ps1 in a fresh
  # console under BOTH PowerShell editions, decodes the served script through
  # cp932 (byte-identical to the JP/CN `iwr|iex` wire path), reads the
  # child's own screen buffer, and asserts the banner glyphs survive with no
  # "?" mojibake. -SelfCheck also proves the detector catches an injected
  # regression. Windows-only; needs a real console, hence the self-hosted VM.
  banner:
    name: banner render check (windows, cp932)
    if: (github.event.inputs.os || 'all') == 'all' || github.event.inputs.os == 'windows'
    runs-on: [self-hosted, windows, x64, build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: banner render check (real console + cp932)
        shell: pwsh
        run: ./scripts/dev/installtest-banner-render.ps1 -SelfCheck

      - name: job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## banner render check (windows)"
            echo "- result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  # Smart App Control, the half of it that is testable: which files this
  # installer puts on a machine are NOT signed by a certificate Windows trusts.
  #
  # Microsoft publishes a signed audit policy for exactly this question --
  # SmartAppControlAuditNoISG -- which does not consult the Intelligent
  # Security Graph (so it is deterministic), logs instead of blocking, and
  # applies "even when you set Smart App Control to Off". The harness applies
  # it before the install and reads the CodeIntegrity ledger afterwards. The
  # ISG REPUTATION verdict is a different question and stays on real hardware:
  # it needs consumer Windows 11 in evaluation mode and gives different answers
  # on different days. See
  # docs/decisions/20260822/2216-sac-signing-requirement-is-testable.md.
  #
  # Hosted, and only hosted: applying a Microsoft-signed App Control policy is
  # not cleanly reversible, so it belongs on a VM that is destroyed after the
  # run -- never on the self-hosted pool. CiTool ships in the image from
  # Windows Server 2025 on, which is what windows-latest is; the harness reads
  # for it rather than assuming it.
  #
  # Nightly, plus its own dispatch input -- NOT the `os` selector, because the
  # signing surface does not vary per OS leg and riding `os` pulled four
  # unrelated Windows legs onto three runners (observed). `-f os=none
  # -f sac_audit=on` is one job on one runner.
  #
  # Nightly rather than per-PR for the same reason the banner check is: it only
  # moves when the installer's shipped file set moves. Nightly rather than
  # dispatch-only because a check nobody remembers to dispatch is a check that
  # rots -- and the thing it catches, a new unsigned binary reaching shipping,
  # arrives without anyone thinking to look.
  #
  # The reboot question that would have kept this manual is settled: run
  # 32575205567 brought the signed policy up with `citool -r` alone on Windows
  # Server 2025, in-job. So there is nothing a hosted runner cannot do here.
  sac-audit:
    name: SAC signing audit (windows, NoISG)
    if: github.event_name == 'schedule' || github.event.inputs.sac_audit == 'on'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Tier 1: no enroll, so no WIF and no control-plane round trip. Signing
      # is orthogonal to enrolment.
      - name: install under the audit policy, then read the ledger
        shell: pwsh
        run: ./scripts/dev/installtest-windows.ps1 -Tier 1 -SacAudit

      - name: upload the signing surface
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sac-signing-audit
          path: ${{ runner.temp }}/sac-signing-audit.txt
          if-no-files-found: warn

  # --- the GPU lane (waired-ai/waired#590, waired-ai/waired#1229) ---------
  #
  # Only vllm-install and agentgrade need a GPU. GitHub's hosted GPU runners
  # are Tesla T4 (compute capability 7.5), below VLLMVerifyImports' SM_80
  # floor, so this lane brings its own hardware: a g2-standard-4 with one L4,
  # created for the run and deleted after it.
  #
  # There is no self-hosted runner. An earlier shape registered the VM as one;
  # that needed a PAT with administration:write on a PUBLIC repository, and it
  # made `runs-on` resolve to a label whose absence GitHub answers by queueing
  # for 24 hours rather than skipping. Both problems are gone here: these jobs
  # run on hosted runners and drive the VM through the GCP API, so a VM that
  # never appears is a failed step in minutes, not a queue that blocks the next
  # nightly behind this workflow's own concurrency group.
  #
  # The VM has no inbound channel — `gcloud compute ssh` does not work under a
  # WIF-impersonated principal, and the IAM that would allow it was removed in
  # 2026-05. It pushes: control state through guest attributes, logs through
  # GCS. Same direction the testnet lane settled on.
  #
  # Each lane gets its own VM. The cache disk is a single zonal PD and can be
  # attached read-write to exactly one instance, so it belongs to the vLLM
  # lane; agentgrade runs without it and says so, rather than silently
  # degrading to a cold run.
  vllm-install:
    name: vLLM install + serve (l4)
    if: >-
      ${{ (github.event_name == 'schedule' && vars.GPU_RUNNER_ENABLED == 'true')
       || (github.event_name == 'workflow_dispatch' && (github.event.inputs.gpu || 'off') != 'off') }}
    runs-on: ubuntu-24.04
    # The lane itself is capped at 90 minutes by gpu-lane-watch.sh; this is the
    # outer bound including create and teardown.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      # `quick` is the smoke alone. Everything else runs every target, because
      # most of them had no caller at all: e2e-vllm-clamp, -fp8 and -spec
      # existed only as Makefile targets, so #675, #676 and #677 shipped with a
      # harness nothing ever invoked. `make e2e-vllm` is `-run
      # TestVLLMGatewayE2E` and nothing more.
      #
      # This list stays HERE rather than on the VM: scripts/ci/gpu-e2e-lane-guard.py
      # reads it to prove every gpu-tagged test has a caller, and the VM echoes
      # back what it actually ran so "named" and "ran" stay separable.
      - name: choose the targets
        id: targets
        run: |
          set -uo pipefail
          targets="e2e-vllm-quick"
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event.inputs.gpu }}" = full ]; then
            targets="e2e-vllm e2e-vllm-clamp e2e-vllm-fp8 e2e-vllm-spec e2e-vllm-power"
          fi
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

      - name: create the L4 VM
        id: up
        run: bash scripts/ci/gpu-lane-up.sh
        env:
          GH_REPO_FULL: ${{ github.repository }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GPU_RUNNER_TEMPLATE: ${{ vars.GPU_RUNNER_TEMPLATE }}
          GPU_RUNNER_ZONES: ${{ vars.GPU_RUNNER_ZONES }}
          GPU_RUNNER_CACHE_DISK: ${{ vars.GPU_RUNNER_CACHE_DISK }}
          GPU_RUNNER_CACHE_ZONE: ${{ vars.GPU_RUNNER_CACHE_ZONE }}
          GPU_RUNNER_ARTIFACT_BUCKET: ${{ vars.GPU_RUNNER_ARTIFACT_BUCKET }}
          GPU_LANE: vllm
          GPU_LANE_SHA: ${{ github.sha }}
          GPU_LANE_TARGETS: ${{ steps.targets.outputs.targets }}

      - name: run the lane and collect its evidence
        id: watch
        run: bash scripts/ci/gpu-lane-watch.sh
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          INSTANCE: ${{ steps.up.outputs.instance }}
          ZONE: ${{ steps.up.outputs.zone }}
          ARTIFACT_URI: ${{ steps.up.outputs.artifact_uri }}
          GPU_LANE: vllm
          GPU_LANE_SHA: ${{ github.sha }}
          GPU_LANE_TARGETS: ${{ steps.targets.outputs.targets }}

      - name: job summary
        if: always()
        run: |
          {
            echo "## vLLM install + serve (l4)"
            echo "- result: **${{ job.status }}**"
            echo "- cache disk: **${{ steps.up.outputs.cache_expected == '1' && 'warm' || 'cold' }}**"
            # FAIL lines first and unbounded: with five targets appending to
            # one log a `tail` can cut exactly the line somebody opened the
            # run for. The PASS/throughput lines are context and can be
            # trimmed; the reds cannot.
            grep -hE -- '--- FAIL' vllm-e2e.log 2>/dev/null \
              | sed -E 's/\x1b\[[0-9;]*m//g; s/^/- /' || true
            grep -ihE 'installed at|[0-9.]+ *tok/s|--- PASS|GPU KV cache size' vllm-e2e.log vllm-install.log 2>/dev/null \
              | sed -E 's/\x1b\[[0-9;]*m//g; s/^/- /' | tail -20 || true
          } >> "$GITHUB_STEP_SUMMARY"

      # `error` below is the anti-false-green guard: a lane that ran must leave
      # evidence. But when the VM never came up the lane never ran, and
      # "No files were found" then names a consequence instead of the cause —
      # two red steps for one fault, with the misleading one last.
      - name: upload logs
        if: always() && steps.watch.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: vllm-gpu-${{ github.run_attempt }}
          path: |
            vllm-install.log
            vllm-e2e.log
            waired-gpu-lane.log
          # `error`, not `ignore`: the watcher verifies a sha256 for every file
          # the VM says it uploaded, so nothing arriving here means the
          # evidence path itself broke, and that must not be a quiet pass.
          if-no-files-found: error
          retention-days: 14

      # Not conditional on success: the VM is the thing that costs money, and a
      # failed lane leaves one running. It is still not the bound — the
      # instance template carries max-run-duration with a DELETE action, and
      # the private repo sweeps hourly.
      - name: delete the VM
        if: always() && steps.up.outputs.instance != ''
        run: bash scripts/ci/gpu-lane-down.sh
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          INSTANCE: ${{ steps.up.outputs.instance }}
          ZONE: ${{ steps.up.outputs.zone }}

  # Agent-harness grade (#322): does a model actually emit structured tool
  # calls under a coding agent's load? The catalog had no axis for this — every
  # grade in it was hand-entered from a one-off run.
  #
  # workflow_dispatch only, never on the schedule. The harness pulls from the
  # public ollama registry, so a registry hiccup on a nightly would be recorded
  # as a model demotion — an upstream outage written into the catalog as a
  # verdict about the model. A human asks for a grade when they want one.
  agentgrade:
    name: agent-harness grade (${{ github.event.inputs.agentgrade_model }})
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
       && github.event.inputs.agentgrade_model != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: create the L4 VM
        id: up
        run: bash scripts/ci/gpu-lane-up.sh
        env:
          GH_REPO_FULL: ${{ github.repository }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GPU_RUNNER_TEMPLATE: ${{ vars.GPU_RUNNER_TEMPLATE }}
          GPU_RUNNER_ZONES: ${{ vars.GPU_RUNNER_ZONES }}
          GPU_RUNNER_ARTIFACT_BUCKET: ${{ vars.GPU_RUNNER_ARTIFACT_BUCKET }}
          GPU_LANE: agentgrade
          GPU_LANE_SHA: ${{ github.sha }}
          GPU_LANE_GRADE_MODEL: ${{ github.event.inputs.agentgrade_model }}

      - name: grade
        id: watch
        run: bash scripts/ci/gpu-lane-watch.sh
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          INSTANCE: ${{ steps.up.outputs.instance }}
          ZONE: ${{ steps.up.outputs.zone }}
          ARTIFACT_URI: ${{ steps.up.outputs.artifact_uri }}
          GPU_LANE: agentgrade
          GPU_LANE_SHA: ${{ github.sha }}

      - name: job summary
        if: always()
        run: |
          {
            echo "## agent-harness grade"
            echo "- model: \`${{ github.event.inputs.agentgrade_model }}\`"
            echo "- result: **${{ job.status }}**"
            grep -hE 'agent-harness grade:|^\s+(greeting|read-file|search-then-edit)' agentgrade.log 2>/dev/null \
              | sed -E 's/\x1b\[[0-9;]*m//g; s/^/- /' | tail -20 || true
            echo
            echo "To fold this into the catalog:"
            echo '```'
            echo "go run ./cmd/catalog-tool agentgrade --import agentgrade-report.json --host nvidia-24gb-discrete"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload report
        if: always() && steps.watch.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: agentgrade-${{ github.run_attempt }}
          path: |
            agentgrade-report.json
            agentgrade.log
            waired-gpu-lane.log
          if-no-files-found: error
          retention-days: 90

      - name: delete the VM
        if: always() && steps.up.outputs.instance != ''
        run: bash scripts/ci/gpu-lane-down.sh
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          INSTANCE: ${{ steps.up.outputs.instance }}
          ZONE: ${{ steps.up.outputs.zone }}
  # --- the signal (#215) -------------------------------------------------
  # A nightly is the one lane nobody is watching. This workflow ran red for
  # five consecutive working days while the failure it was reporting (#178)
  # sat in its own logs, and the way anyone eventually found out was a user
  # hitting the bug and filing it by hand. Job summaries do not help: a
  # summary is read only by someone who already opened the run.
  #
  # One job that needs() every lane rather than a step inside each: matrix
  # legs finish concurrently, so per-leg filing would race and produce
  # several issues for one broken night. This names every red lane in one
  # issue, and dedupes on the tag until a human closes it.
  #
  # Schedule only. A workflow_dispatch is someone watching the run already;
  # filing an issue at them is noise.
  #
  # NOT required-check instead: these lanes install a real engine and pull a
  # multi-GB model from an external registry — exactly the externally-flaky
  # shape that stays out of the ruleset, the same call already made for the
  # testnet gate.
  report:
    name: report a red nightly
    # `legs` is in here too: if the matrix selector fails, every lane below
    # it is SKIPPED rather than failed, and without this the night would go
    # entirely unreported — the exact silence this job exists to end.
    #
    # `agentgrade` is deliberately NOT here. It is dispatch-only and never
    # runs on a schedule, and its red means "this model cannot drive a coding
    # agent" — a measurement result somebody asked for, not a broken night.
    # Filing an issue for it would report a verdict as an outage.
    #
    # The second clause of the `if:` below exists because this job could not see
    # the one thing that was actually wrong with the GPU lane.
    # `contains(needs.*.result, 'failure')` counts failures; a lane that
    # is SKIPPED every single night is invisible to it. vllm-install was
    # skipped on all 55 of its job records between 2026-07-24 and 2026-08-21 —
    # a quarter of an accepted decision going unmet — and this reporter, which
    # exists precisely to end that kind of silence (#215), stayed quiet the
    # whole time (waired-ai/waired#1229).
    #
    # The fix is narrow on purpose. While GPU_RUNNER_ENABLED is unset the lane
    # is DORMANT BY DESIGN and skipping is correct, so this keeps quiet — the
    # dormancy contract in docs/decisions/20260723/1910-... is preserved. Once
    # the variable is set, someone has said this lane should run, and a skip is
    # then a broken night rather than a design.
    needs: [legs, installtest-inference, daemon-engine, engine-only, routing, banner, vllm-install]
    if: >-
      always() && github.event_name == 'schedule'
      && (contains(needs.*.result, 'failure')
          || (vars.GPU_RUNNER_ENABLED == 'true' && needs.vllm-install.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: file an issue naming the red lanes
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE_TAG: "[nightly-installtest]"
          RESULT_INFERENCE: ${{ needs.installtest-inference.result }}
          RESULT_DAEMON_ENGINE: ${{ needs.daemon-engine.result }}
          RESULT_ENGINE_ONLY: ${{ needs.engine-only.result }}
          RESULT_ROUTING: ${{ needs.routing.result }}
          RESULT_BANNER: ${{ needs.banner.result }}
          RESULT_VLLM: ${{ needs.vllm-install.result }}
          GPU_RUNNER_ENABLED: ${{ vars.GPU_RUNNER_ENABLED }}
        run: |
          set -euo pipefail
          # Which results count as red lives in scripts/ci/nightly-red-lanes.sh
          # with a self-test, not inline here. Inline workflow bash is code no
          # test can reach, and the defect being fixed was exactly an
          # unexercised classification (waired-ai/waired#1229) — adding a rule
          # to untested inline bash would have repeated it in a new place.
          red="$(bash scripts/ci/nightly-red-lanes.sh)"
          export TITLE="${TITLE_TAG} installtest-inference nightly failed"
          export BODY="$(printf 'Red lanes:\n\n%s\nRun: %s/%s/actions/runs/%s\n\nThis issue dedupes on %s, so it is filed once per outage, not once per night. Closing it re-arms the report.\n' \
            "${red}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${TITLE_TAG}")"
          bash scripts/ci/nightly-file-issue.sh
