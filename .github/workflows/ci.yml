# PR/push gate for waired-agent. Derived from the monorepo ci.yml at the
# #184 split. All jobs run on GitHub-hosted runners: the repo is public,
# so hosted standard runners are free, and keeping PR CI off self-hosted
# infrastructure is the safer default for a public repo.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint (gofmt + vet + golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          set -euo pipefail
          out=$(gofmt -l .)
          if [ -n "${out}" ]; then
            echo "::error::gofmt issues:"
            printf '%s\n' "${out}"
            exit 1
          fi

      - name: no tracked file is also gitignored
        # A 20MB compiled `waired` was tracked at the repo root for two
        # weeks (#90) while .gitignore named it the whole time — gitignore
        # does not apply to an already-tracked path, so the entry looked
        # like protection and was none. Each root-level `go build` rewrote
        # it and the next `git add -A` swept another 20MB blob into a
        # public repo (#17, #56, #100). The contradiction is checkable even
        # though .gitignore cannot check it for itself.
        run: bash scripts/ci/tracked-ignored-guard.sh

      - name: tracked-ignored guard self-test
        run: bash scripts/ci/tracked-ignored-guard-test.sh

      # The base-ref guard's decision table (base branch + the
      # `stacked-on:` opt-out) runs entirely off two environment
      # variables, so it is exercised here rather than only in the PR
      # context where it fires. See scripts/ci/base-ref-guard.sh.
      - name: base-ref guard self-test
        run: bash scripts/ci/base-ref-guard-test.sh

      # docs-preview-reap.yml DELETES Firebase Hosting channels from the
      # project that also serves docs.waired.ai. The rule deciding which ones
      # is a pure stdin/stdout selector precisely so its blast radius can be
      # pinned here, offline, instead of only in the workflow that runs it.
      - name: docs preview channel selector self-test
        run: bash scripts/ci/docs-preview-select-test.sh

      - name: go vet (root + proto)
        run: |
          set -euo pipefail
          go vet ./...
          (cd proto && go vet ./...)
          # `make verify-cross` covers the ROOT module on all three OSes but
          # not proto/, so until now the shared wire-protocol module had no
          # cross-OS check of any kind (#216). It has no _GOOS.go files today
          # and touches neither os nor path/filepath, which is exactly why
          # this is ~2s — and why it is the tripwire for the day that changes.
          (cd proto && GOOS=windows go vet ./... && GOOS=darwin go vet ./...)

      # The hardened production build (-tags prod) must compile and vet
      # cleanly; buildflag gates the agent-side bypass flags off.
      - name: prod build smoke (-tags prod)
        run: |
          set -euo pipefail
          go build -tags prod ./...
          go vet -tags prod ./...
          go test -tags prod ./internal/buildflag/...

      # The routing harness is behind `-tags integration`, so nothing in the
      # always-on lanes compiles it: a typo there used to surface only when the
      # paths-gated sentinel ran, 15 minutes in (waired-agent#29).
      - name: integration-tag build smoke (routing harness)
        run: go vet -tags integration ./internal/e2e/integration/...

      - name: proto dependency allowlist
        run: |
          set -euo pipefail
          # The shared protocol module must stay minimal and auditable:
          # stdlib plus golang.org/x/crypto (disco sealed frames:
          # ChaCha20-Poly1305 / X25519 / HKDF) and its x/sys transitive.
          # Checked at the package-import level: `go list -m all` would
          # overcount (x/crypto's own go.mod pulls x/net etc. into the
          # module graph without them ever being imported).
          bad=$(cd proto && go list -f '{{if not .Standard}}{{.ImportPath}}{{end}}' -deps ./... | \
            grep -vE '^$' | \
            grep -vE '^github\.com/waired-ai/waired-agent/proto(/|$)' | \
            grep -vE '^golang\.org/x/(crypto|sys)(/|$)' || true)
          if [ -n "${bad}" ]; then
            echo "::error::proto packages import dependencies outside the allowlist:"
            printf '%s\n' "${bad}"
            exit 1
          fi

      - name: proto-consumer guard (every proto field has a producer)
        # Fails when an exported proto field has no writer under cmd/ or
        # internal/. proto-guard cannot see this class: the additive rule
        # REQUIRES omitempty, so a field nobody writes is byte-identical
        # on the wire to one that does not exist, and proto, agent and
        # control-plane tests all stay green (#180). Fields written
        # elsewhere, written inside proto/, or still owed a producer are
        # declared — with the category checked — in
        # scripts/ci/protoconsumer/exemptions.go.
        run: go run ./scripts/ci/protoconsumer

      - name: license check (no copyleft dependencies)
        # Apache-2.0 repo (#666): fail fast when a new dependency brings
        # forbidden/restricted (GPL/LGPL-class) licensing. Own modules
        # are excluded — the repo LICENSE covers them and the replace'd
        # proto module carries no license file of its own.
        run: |
          set -euo pipefail
          go run github.com/google/go-licenses@v1.6.0 check ./... \
            --disallowed_types=forbidden,restricted \
            --ignore github.com/waired-ai/waired-agent \
            --ignore github.com/waired-ai/waired-agent/proto

      - name: decision log guard (front-matter + supersede graph)
        # One file per decision under docs/decisions/; this checks the parts
        # a reviewer cannot eyeball across the whole tree — front-matter
        # status, its agreement with the `## Status` prose, and that
        # supersedes / superseded_by resolve and agree both ways.
        run: python3 scripts/ci/decision-log-guard.py

      - name: testnet gate guard (every internal/ package classified)
        # Keeps the per-PR testnet gate's judgement-based allowlist honest:
        # a new internal/ package fails lint until it is classified in
        # scripts/ci/testnet-relevant-paths.txt or
        # scripts/ci/testnet-nonrelevant-packages.txt (same design as the
        # monorepo's guard, waired#738).
        run: bash scripts/ci/testnet-gate-guard.sh

      - name: agent-grade coverage guard (every bundled model has a verdict)
        # #322: a bundled model with no coding-agent verdict is one nobody
        # decided about. The catalog shipped qwen2.5-coder for months while
        # it handed coding agents raw JSON as prose, because the only
        # capability signal was a string every manifest carried.
        #
        # Two assertions, both about the OFFERED catalog:
        #
        #   --check        every offered variant has a current verdict
        #   --require-pass none of them is above the retirement line
        #
        # --require-pass is not a flake detector. The line is a Wilson 95%
        # lower bound on the per-call failure rate against
        # catalog.RetireFailureRate (0.5), so at 24 trials it needs 17 of
        # 24 to trip; the worst entry in the catalog today sits at 9 of 24
        # (a 23% bound) and is nowhere near it. What it asserts is the one
        # thing worth asserting: no model we offer can be shown, at 95%
        # confidence, to fail more often than it works (#475).
        #
        # Turning it on cost exactly one entry — qwen2.5-coder-0.5b, which
        # failed 24 of 24 on both tool-requiring cases. #475 withheld it,
        # #200 built the retired->successor map and deleted it, so it is
        # out of the catalog entirely and its names now resolve to
        # qwen3.5-0.8b. Do NOT re-enable a model past this line to make a
        # red go away: withhold it, or retire it.
        #
        # A model no runner can host is declared in agentgrade.json's
        # "unmeasurable" map with a reason, so the escape hatch is a stated
        # decision rather than silence.
        run: go run ./cmd/catalog-tool agentgrade --check --require-pass

      # Keep the paths-gated client gates' filters honest (re-homed from the
      # monorepo at #1). Each guard fails lint if its workflow's paths lose a
      # required anchor — or, for the go-list-derived ones, if a new test
      # dependency is neither covered by a paths glob nor allowlisted — so a
      # paths-gated gate cannot silently drop coverage. installtest is now
      # always-on (no paths filter), so it deliberately has no guard.
      - name: amsi-scan paths guard
        run: bash scripts/ci/amsi-scan-paths-guard.sh

      - name: routing-sentinel paths guard
        run: bash scripts/ci/routing-sentinel-paths-guard.sh

      - name: tray-darwin paths guard
        run: bash scripts/ci/tray-darwin-paths-guard.sh

      # Boundary invariants (#209). Each one closes a place where a
      # defect class re-entered the tree unopposed.
      - name: exec.LookPath allowlist
        # "Is X installed" answered from $PATH alone has been wrong four
        # times (#67, the deploy path, #179, the setup-install probe):
        # waired's own engine lives under the state dir, off $PATH, and a
        # Windows LocalSystem service inherits no user PATH at all. #179
        # collapsed five contradicting engine predicates into one; this
        # stops them growing back. Every call site is declared, with its
        # reason, in scripts/ci/lookpathguard/exemptions.go.
        run: go run ./scripts/ci/lookpathguard

      - name: management HTTP client allowlist
        # Since waired#836 the daemon serves only five allow-listed GET
        # routes over the loopback TCP port while its socket is bound, and
        # 403s the rest. Six sites in cmd/waired built their own client
        # instead of using mgmtReadRoute, and all six failed in production
        # — peers list, worker set --pin, two doctor rows, init's daemon
        # authority, and the Claude Code statusline, which said "agent
        # down" on every turn of a healthy machine (#785). Nothing went
        # red: the CLI and the daemon were each correct alone. Every
        # legitimate client is declared, with its reason, in
        # scripts/ci/mgmtclientguard/exemptions.go.
        run: go run ./scripts/ci/mgmtclientguard

      - name: internal/platform test floor
        # internal/platform/browser shipped three OSes' worth of
        # implementation with no _test.go at all, then produced #181,
        # #182 and #183. Nothing could have gone red.
        run: bash scripts/ci/platform-test-floor-guard.sh

      - name: tray dialog seams
        # The tray's darwin dialog helpers block on a real modal until a
        # human clicks; the elevation ones raise a password prompt. A test
        # reaching one does not fail on a headless macOS runner, it hangs to
        # the job timeout — which is why the tray unit suite could not run on
        # darwin at all (#152). This checks both halves of the fix: every
        # handler goes through the seam, and every seam has a TestMain stub.
        run: bash scripts/ci/tray-dialog-seam-guard.sh

      - name: tray row mutations go through the guarded diff
        # On fyne.io/systray's Windows backend, SetTitle/SetTooltip/Enable/
        # Disable on a HIDDEN item re-insert it into the menu — mutating a
        # hidden row is un-hiding it. That produced the blank rows and the
        # empty "Models" / "Claude Code" parents in the daemon-down menu
        # (#317), and no Linux test leg can see it. rows.go suppresses those
        # mutations; this keeps the next handler from going around it.
        run: bash scripts/ci/tray-row-mutation-guard.sh

      - name: tray row mutation guard self-test
        run: bash scripts/ci/tray-row-mutation-guard-test.sh

      - name: tray submenu parent guard
        # A submenu parent Hide()n before its children are created can never
        # take one on Windows: the first AddSubMenuItem is what creates the
        # submenu, and Hide() has already removed the parent from its menu.
        # endRowPass then walks a Go map, so which rows survive the first
        # paint is random — three restarts on one host rendered the same
        # submenu with 8, 5 and 4 rows (waired-agent#1063). No Linux leg can
        # see it.
        run: bash scripts/ci/tray-submenu-parent-guard.sh

      - name: tray submenu parent guard self-test
        run: bash scripts/ci/tray-submenu-parent-guard-test.sh

      - name: tray grey rows say why they are grey
        # Disable() means "unavailable" to the person reading the menu, so a
        # row reporting a healthy state must not be greyed — that is what the
        # owner reported on 2026-08-28 against the status rows. Every
        # Disable() in onReady therefore carries `// grey: <why>`, and this
        # fails the build for one that does not. No test can see it: the
        # enabled/disabled axis lives in onReady, which needs a real systray
        # session.
        run: bash scripts/ci/tray-grey-row-guard.sh

      - name: tray grey row guard self-test
        run: bash scripts/ci/tray-grey-row-guard-test.sh

      - name: tray menu labels are escaped for the OS that draws them
        # Win32 menus read `&` as the mnemonic prefix and the dbusmenu spec
        # gives `_` the same role, so a label carrying one loses it:
        # "Privacy & safety…" drew as "Privacy  safety…" on Windows for as
        # long as the row existed (waired-agent#1096). Dynamic labels are
        # covered structurally by rows.go's setTitle; this guards the two
        # ways around it — a direct SetTitle, and a creation-time literal.
        run: bash scripts/ci/tray-menu-label-guard.sh

      - name: tray menu label guard self-test
        run: bash scripts/ci/tray-menu-label-guard-test.sh

      - name: installtest failure strings still exist in the product
        # The three installtest harnesses fail a leg when `waired init`'s
        # transcript reports an engine-install failure (#215). That assert is
        # a grep for product wording, and a grep for wording the product
        # stopped printing is green forever — the same "cannot fail" shape
        # #178 shipped through. This checks the three copies agree and that
        # every string is still printed by cmd/waired.
        run: bash scripts/ci/harness-failure-strings-guard.sh

      # Self-tests for the shell guards in this repo that take their input
      # from outside git (a fixture tree, a changed-file list, GitHub's
      # issue search), so a change to any one's decision table cannot ship
      # unexercised.
      - name: platform test floor guard self-test
        run: bash scripts/ci/platform-test-floor-guard-test.sh

      - name: installer mirror guard self-test
        run: bash scripts/ci/installer-mirror-guard-test.sh

      - name: apt bounds guard self-test
        run: bash scripts/ci/apt-bounds-guard-test.sh

      - name: build version resolver self-test
        # The two version strings every artifact is stamped with, and the
        # dpkg ordering the .deb one has to produce. Its inputs are a
        # workflow trigger, so no build reaches the tag branch until a
        # release is already being cut (waired-agent#780).
        run: bash scripts/ci/resolve-build-version-test.sh

      - name: GPU e2e lane guard (every gpu test has a caller)
        # internal/e2e/inference is `//go:build e2e && gpu` and each Makefile
        # target pins its own `-run`, so a new test function COMPILES and is
        # then executed by nothing. That is not a red test or a skip — it is
        # silence, the one outcome CI cannot report. waired-ai/waired#1229
        # found three targets in that state; #958 would have been the fourth
        # on the same day, with the warning comment already in the workflow.
        run: python3 scripts/ci/gpu-e2e-lane-guard.py

      - name: nightly red-lane classification self-test
        # Which job results wake a human. Split out of the workflow's inline
        # bash so it is testable at all — the GPU lane was skipped on every
        # scheduled run for a quarter and the reporter, which counted only
        # `failure`, never saw it (waired-ai/waired#1229). Both directions are
        # asserted: a dormant lane must stay quiet, or the dormancy contract
        # turns into a nightly issue about a decision being honoured.
        run: bash scripts/ci/nightly-red-lanes-test.sh

      - name: nightly issue filer self-test
        # The dedupe-vs-create decision only runs when the script talks to
        # GitHub, so neither DRY_RUN nor a green nightly reaches it. A stub
        # `gh` exercises it without a token or a broken nightly (#215).
        run: bash scripts/ci/nightly-file-issue-test.sh

      - name: testnet gate verdict self-test
        # The gate decides whether an unverified client may be released,
        # from the API of a repo this one cannot see. A stub `gh` builds
        # the JSON the API would return and the gate's own --jq runs over
        # it, so the verdict table is exercised without a token or a
        # ~25-minute GCP testnet (#697).
        run: bash scripts/ci/testnet-require-green-remote-test.sh

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  dco:
    # DCO enforcement (#666): every PR commit needs a Signed-off-by
    # trailer (CONTRIBUTING.md). Deliberately checkout-free: the job
    # reads commit metadata via the API only, so fork PRs get this
    # feedback without executing any fork code.
    name: dco (Signed-off-by on every commit)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: check Signed-off-by trailers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Merge commits (>1 parent) are exempt, matching the DCO app's
          # behaviour; everything else must carry the trailer.
          bad=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/commits" \
            --paginate \
            --jq '.[] | select((.parents | length) < 2)
                      | select((.commit.message | test("(?m)^Signed-off-by: .+ <.+@.+>$")) | not)
                      | .sha')
          if [ -n "${bad}" ]; then
            echo "::error::commits missing a Signed-off-by trailer (see CONTRIBUTING.md; use 'git commit -s'):"
            printf '%s\n' "${bad}"
            exit 1
          fi

  gitleaks:
    # Secret scan over the full git history (config: .gitleaks.toml).
    # Runs the pinned release binary instead of gitleaks-action (the
    # action requires a license key for organization repos).
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -C /tmp -xzf /tmp/gitleaks.tgz gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go test (root)
        run: go test ./... -timeout 10m

      # `go test -race` is the only thing that finds a data race, and nothing
      # here ran it (#506). The daemon is the wrong program to leave uncovered:
      # it is long-lived and heavily concurrent (setup reconciler, background
      # pulls, engine bounces, management handlers reading provider state), and
      # a race there is not a wrong answer — it is `fatal error: concurrent map
      # read and map write`, which no recover() catches, on a user's machine.
      #
      # A STEP inside `unit tests`, not a new job: `unit tests` is a required
      # status check (see the comment above unit-multios, which is a separate
      # job for exactly this reason), so a step keeps the context name — no
      # ruleset edit, and no open PR waiting on a context that never reports.
      # A new context would be advisory-only, and an advisory race lane is one
      # nobody looks at.
      #
      # The plain run above STAYS, and is not redundant: release binaries are
      # built without cgo and `-race` forces CGO_ENABLED=1, so the plain run is
      # the one that exercises the build that actually ships.
      #
      # Linux only. unit-multios (darwin) already sets cgo: "1" but doubling a
      # 25-minute macOS job is not worth it, and its windows leg deliberately
      # runs at Go's cgo default. Root module only: proto/ is embedded catalog
      # data and codegen with no goroutines.
      #
      # Cost measured 2026-08-05 over 81 packages at GOMAXPROCS=4 with a cold
      # build cache: 37.2s plain vs 57.7s race. This suite's time is spent
      # waiting (timeouts, sleeps) and the detector taxes CPU-bound work, so
      # expect +30-45s on the slower hosted runner against a 15-minute job
      # timeout and a PR critical path set by the ~24-minute testnet gate.
      #
      # A red here is a defect, not a flake: `-race` reports only accesses that
      # actually happened and never fires on correctly synchronised code. It is
      # non-deterministic in the other direction only — a race can go
      # unreported on a run that did not interleave, so a green re-run of a red
      # is not an answer. Equally, green here is a regression bar, not a claim
      # that the daemon is race-free: the detector only sees code paths the
      # tests actually execute concurrently.
      - name: go test (root, race detector)
        run: go test -race ./... -timeout 15m

      - name: go test (proto)
        run: cd proto && go test ./... -timeout 5m

  # The same suite on the other two OSes (#216). 25 OS-tagged _test.go files
  # (18 darwin, 7 windows) had never executed anywhere: `make verify-cross`
  # only ever VETTED them. service_darwin_test.go's 20 assertions, which pin
  # the #176 launchd bug, were inert. So were the 13 files tagged
  # `linux || darwin`, which ran on exactly one of the two.
  #
  # A NEW job rather than a matrix on `unit` above: `unit tests` is a required
  # status check, and matrixing it would rename the context to
  # `unit tests (linux)` and leave every open PR waiting on one that no longer
  # reports. Same reasoning as installer-pwsh next to install-scripts.
  #
  # The check name keys off matrix.goos, not the runner label, so a
  # macos-14 -> macos-15 image bump is a one-line change here and not a
  # ruleset edit.
  #
  # This is reinforcement, not the main line. The primary strategy is pushing
  # OS-varying decisions into untagged (GOOS, facts) -> plan functions with
  # three-value table tests (CLAUDE.md "Test discipline"); this job is the
  # catch-basin for what genuinely cannot be untagged — real launchctl, SCM,
  # the registry, AF_UNIX. As that work lands, this job should matter less.
  #
  # No same-repo `if:` guard, unlike installtest.yml / routing-sentinel.yml.
  # Those hold an OIDC identity or execute a downloaded third-party binary.
  # This runs the same `go test` the already-required, guard-free `unit` job
  # runs on fork PRs today; guarding it would mean a check that is skipped
  # precisely where cross-OS signal is wanted most.
  unit-multios:
    name: unit tests (${{ matrix.goos }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false      # a red windows leg must not hide a green darwin one
      matrix:
        include:
          - goos: darwin
            runs-on: macos-14
            # internal/gui/tray links Cocoa (activation_darwin.m, and
            # fyne.io/systray's NSStatusItem backend). Stated rather than
            # left to the default so a runner image without the Xcode CLT
            # fails as a compile error instead of silently flipping tags.
            cgo: "1"
            timeout: 25
          - goos: windows
            runs-on: windows-latest
            cgo: ""         # empty = Go's default; nothing here needs cgo
            timeout: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # -count=1 so a "Re-run failed jobs" genuinely re-executes: setup-go
      # caches GOCACHE, and Go caches test RESULTS there, so a re-run of the
      # same commit could otherwise replay a verdict. That re-run loop is how
      # a flaky leg gets judged before this becomes a required check.
      #
      # proto/ is deliberately not tested here: it has no _GOOS.go files and
      # never touches os, path/filepath or runtime.GOOS, so a cross-OS run
      # buys no information. The `lint` job vets it for all three OSes instead.
      - name: go test (root)
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test ./... -count=1 -timeout 10m

  # The same darwin suite, on a runner made to look like a machine that has
  # Waired installed (#386).
  #
  # `unit tests (darwin)` runs on a CLEAN macos-14. That is the blind spot:
  # tests that read machine-global state — the OS well-known ollama paths,
  # $HOME's cache dir, and until secrets became plain files, the Keychain —
  # were green here while red on every developer Mac with Waired on it. One
  # of them sent the host's real device access token to its own httptest
  # server and printed it in the failure message; another passed exactly
  # once per machine and failed forever after, because it wrote a marker
  # into the developer's real ~/Library/Caches on the run that passed. A
  # clean runner cannot see any of that, so nothing could go red, and the
  # fix could only be verified by hand on one Mac.
  #
  # A NEW job rather than a step on unit-multios, for the same reason
  # unit-multios is not a matrix on `unit`: this must be able to go red
  # without blocking, until it has proven itself. It is deliberately not in
  # the required set yet.
  #
  # The seeded values are junk on purpose. Their content does not matter —
  # any test that reads them instead of its own fixture fails, whether it
  # fails on the value or on parsing it. What matters is that they EXIST,
  # because "exists" is the whole difference between this runner and the
  # clean one.
  unit-seeded-host:
    name: unit tests (darwin, seeded host)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # /Applications/Ollama.app is not worth building; /usr/local/bin is the
      # second entry of the same candidate list and is what ResolveBinary
      # stats after $PATH. It is also ON $PATH here, which contaminates the
      # LookPath source too — both of the ways a real Mac differs.
      - name: seed a well-known-path ollama
        run: |
          set -euo pipefail
          printf '#!/bin/sh\necho "ollama version is 0.0.0-ci-seed"\n' >/tmp/ollama-seed
          sudo install -m 0755 /tmp/ollama-seed /usr/local/bin/ollama
          /usr/local/bin/ollama --version

      # The exact poison: cmd/waired's fallback hook keys its per-session
      # marker off os.UserCacheDir(), which reads $HOME on darwin. A test
      # that does not seal HOME sees this and stays silent.
      - name: seed the claude fallback cache
        run: |
          set -euo pipefail
          dir="${HOME}/Library/Caches/waired/claude-fallback"
          mkdir -p "${dir}"
          printf '1' >"${dir}/sess-A"
          printf '5' >"${dir}/sess-B"

      - name: go test (root)
        env:
          CGO_ENABLED: "1"
        # -count=2 rather than -count=1, unlike the other legs. Sealing per
        # package is not enough on its own: a package-wide temp HOME is
        # itself shared state, so the second run of a test sees what the
        # first wrote. Two of the bugs fixed for #386 survived a green
        # -count=1 and only showed up here.
        run: go test ./... -count=2 -timeout 20m

      - name: unseed
        if: always()
        run: |
          set -uo pipefail
          sudo rm -f /usr/local/bin/ollama
          rm -rf "${HOME}/Library/Caches/waired"
          exit 0

  unit-testharness:
    name: unit tests (testharness)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go test -tags testharness
        run: go test -tags testharness ./internal/testharness/... -timeout 10m

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: cross-compile every cmd/*
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for cmd in cmd/*/; do
            name=$(basename "${cmd}")
            echo "==> building ${name} for ${GOOS}/${GOARCH}"
            go build -trimpath -ldflags="-s -w" -o /dev/null ./${cmd}
          done

      - name: verify-cross (3-OS go vet)
        run: make verify-cross

  install-scripts:
    name: install-scripts (dash matrix + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # busybox is not preinstalled on the hosted image; without it
      # installtest-dash.sh silently drops its `busybox sh` matrix leg.
      - name: install busybox (third shell in the dash matrix)
        run: sudo apt-get install -y busybox

      - name: shellcheck installer scripts
        run: make install-script-lint

      - name: install.sh dash dispatch matrix
        run: bash scripts/dev/installtest-dash.sh

      - name: autostart Exec path guard
        run: bash scripts/ci/autostart-exec-guard.sh

      # #893: apt waits for ever by default, and an unbounded apt-get in
      # the installers took whole CI jobs down with it — and would hang a
      # user's install just as silently.
      - name: apt bounds guard
        run: bash scripts/ci/apt-bounds-guard.sh

  # The PowerShell counterpart of install-scripts. A separate job, not extra
  # steps there: install-scripts is a required status check, and renaming it to
  # describe the new content would leave every open PR waiting on a check name
  # that no longer reports.
  installer-pwsh:
    name: installer-pwsh (install.ps1 dry-run matrix + PSScriptAnalyzer)
    runs-on: ubuntu-latest        # pwsh 7 is preinstalled; the matrix is hermetic
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Pinned: PSScriptAnalyzer ships new rules in minor releases, and this is
      # a required check -- an unrelated PR must not go red because the gallery
      # moved. Bump deliberately, with the settings file updated in the same PR.
      - name: install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      - name: PSScriptAnalyzer (shipped .ps1)
        run: make ps-script-lint

      - name: install.ps1 dry-run dispatch matrix
        run: pwsh -NoProfile -File scripts/dev/installtest-pwsh.ps1

      # The serving-engine asserts (#494) run only in installtest-inference,
      # which is schedule/dispatch-only -- so a copy of them that had stopped
      # being able to fail would sit green for a long time with nothing on a PR
      # to say so. This drives all three copies through every branch in about a
      # second. It lives in THIS job because it needs pwsh for the Windows copy
      # (install-scripts has shellcheck but no PowerShell).
      - name: serving-engine asserts (3-OS parity + every branch)
        run: bash scripts/dev/installtest-serving-asserts.sh

      # Same reason, one assert along (#573): the model-readiness verdict also
      # runs only in installtest-inference, and it spent months reporting the
      # host-cutoff probe as the bundled model because `models.ready` cannot
      # tell a probe from a pick. This drives all three copies over one shared
      # fixture table.
      - name: model-readiness verdict (3-OS parity over shared fixtures)
        run: bash scripts/dev/installtest-model-ready-asserts.sh
